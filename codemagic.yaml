# Codemagic reads this from the repo root. No Dart file imports it.
# Simulator .app is what App Preview → Quick launch can run in the browser.
# Add ios_signing and `flutter build ipa` after the Apple team and certificates exist.
workflows:
  ios-tests:
    name: iOS tests
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        script: flutter test
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug --dart-define=API_BASE_URL=https://firststep-backend-czn5.onrender.com
    artifacts:
      - build/ios/iphonesimulator/*.app
